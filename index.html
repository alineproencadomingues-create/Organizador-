<<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador Logística — Compartilhado</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --urgente: #ef4444;
      --urgente-bg: #fef2f2;
      --media: #eab308;
      --media-bg: #fefce8;
      --pouco: #22c55e;
      --pouco-bg: #f0fdf4;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.45;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      padding: 18px 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 1.3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      background: #e0f2fe;
      color: #075985;
    }

    .status-badge.synced {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--surface-alt);
    }

    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    button.btn-toggle-extra {
      background: #eef2ff;
      color: #1e40af;
      border-color: #c7d2fe;
      font-weight: 600;
    }

    button.btn-toggle-extra:hover {
      background: #e0e7ff;
    }

    button.btn-danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fff;
    }

    button.btn-danger:hover {
      background: #fef2f2;
    }
