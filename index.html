<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador Logística — Compartilhado</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --urgente: #ef4444;
      --urgente-bg: #fef2f2;
      --media: #eab308;
      --media-bg: #fefce8;
      --pouco: #22c55e;
      --pouco-bg: #f0fdf4;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.45;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      padding: 18px 22px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 1.3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      background: #e0f2fe;
      color: #075985;
    }

    .status-badge.synced {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--surface-alt);
    }

    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    button.btn-toggle-extra {
      background: #eef2ff;
      color: #1e40af;
      border-color: #c7d2fe;
      font-weight: 600;
    }

    button.btn-toggle-extra:hover {
      background: #e0e7ff;
    }

    button.btn-danger {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fff;
    }

    button.btn-danger:hover {
      background: #fef2f2;
    }

    .extra-panel {
      display: none;
      margin-bottom: 20px;
    }

    .extra-panel.open {
      display: block;
    }

    .extra-header-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .grid-main {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .grid-main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .card-header h2 {
      font-size: 1.05rem;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-month-title {
      font-weight: 700;
      min-width: 145px;
      text-align: center;
      text-transform: capitalize;
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      padding-bottom: 6px;
    }

    .day-btn {
      min-height: 62px;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
    }

    .day-btn.other-month {
      opacity: 0.4;
      background: var(--surface-alt);
    }

    .day-btn.today {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .day-btn.selected {
      background: #eff6ff;
      border-color: var(--primary);
    }

    .day-num {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.urgente { background: var(--urgente); }
    .dot.media { background: var(--media); }
    .dot.pouco { background: var(--pouco); }

    .legenda {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .legenda span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.9rem;
    }

    .task-note-input {
      min-height: 68px;
      resize: vertical;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .task-item {
      border: 1px solid var(--border);
      border-left-width: 5px;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task-item.urgente {
      border-left-color: var(--urgente);
      background: var(--urgente-bg);
    }

    .task-item.media {
      border-left-color: var(--media);
      background: var(--media-bg);
    }

    .task-item.pouco {
      border-left-color: var(--pouco);
      background: var(--pouco-bg);
    }

    .task-item.done .task-title {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .task-note-box {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px dashed rgba(107, 114, 128, 0.35);
      font-size: 0.84rem;
      color: var(--text);
      white-space: pre-wrap;
    }

    .task-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tag-prazo, .tag-pessoa {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
    }

    .tag-pessoa {
      color: #1e3a8a;
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }

    .task-actions button {
      padding: 5px 8px;
      font-size: 0.78rem;
    }

    .notes-area {
      min-height: 95px;
      resize: vertical;
    }

    .note-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fffbeb;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .note-item p {
      white-space: pre-wrap;
      font-size: 0.9rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 18px 8px;
    }
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>
          Organizador Logística
          <span id="syncStatus" class="status-badge">Conectando...</span>
        </h1>
        <p </p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn-toggle-extra" id="toggleExtraBtn" onclick="alternarPainelExtra()">
          Ver Todas as Tarefas
        </button>
        <button type="button" onclick="irParaHoje()">Hoje</button>
        <button type="button" onclick="baixarModeloCSV()">Modelo CSV</button>
        <button type="button" onclick="document.getElementById('importCsvFile').click()">Importar CSV</button>
        <input type="file" id="importCsvFile" accept=".csv,.txt,.tsv" style="display:none" onchange="importarCSV(event)" />
        <button type="button" onclick="document.getElementById('importExcelFile').click()">Importar Excel</button>
        <input type="file" id="importExcelFile" accept=".xlsx,.xls,.ods" style="display:none" onchange="importarExcel(event)" />
        <button type="button" onclick="exportarBackup()">Exportar Backup</button>
        <button type="button" onclick="document.getElementById('importFile').click()">Importar Backup</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarBackup(event)" />
      </div>
    </header>

    <section class="card extra-panel" id="extraTasksPanel">
      <div class="card-header">
        <h2>Todas as Tarefas Pendentes</h2>
        <button type="button" onclick="alternarPainelExtra()">Ocultar</button>
      </div>
      <div class="extra-header-info">
        <p style="font-size:0.82rem; color:var(--muted);">
          Visão geral de tudo o que ainda falta fazer, ordenado por data e horário.
        </p>
        <span id="pendingCountBadge" class="tag-prazo">0 pendentes</span>
      </div>
      <div class="task-list" id="allPendingTasksList"></div>
    </section>

    <div class="grid-main">
      <div>
        <section class="card">
          <div class="card-header">
            <h2>Calendário Mensal</h2>
            <div class="cal-nav">
              <button type="button" onclick="mudarMes(-1)">&lt;</button>
              <div class="cal-month-title" id="monthTitle"></div>
              <button type="button" onclick="mudarMes(1)">&gt;</button>
